[package]
name = "transitions"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/transitions.rs"
crate-type = ["rlib"]

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
gpu = { version = "0.1.0", path = "../gpu" }
thiserror = "2.0.18"
wgpu = "29.0.1"

[dev-dependencies]
naga = { version = "29.0.1", features = ["wgsl-in"] }
